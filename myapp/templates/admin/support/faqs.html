{% extends "admin/base.html" %}
{% block title %}FAQs{% endblock %}

{% block content %}
<div class="modal fade" id="addFAQModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Add FAQ</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <form id="addFAQForm" method="POST">
                    {% csrf_token %}
                    <div class="mb-3"><label>Question</label><input type="text" name="question" class="form-control" required></div>
                    <div class="mb-3"><label>Answer</label><textarea name="answer" class="form-control" rows="3"></textarea></div>
                    <div class="mb-3"><label>Category</label><input type="text" name="category" class="form-control" value="General"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="submit" form="addFAQForm" class="btn-primary-custom">Save</button>
            </div>
        </div>
    </div>
</div>

<div class="page-header d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div><h1>FAQs</h1><p>Manage frequently asked questions</p></div>
    <div class="page-header-actions"><button class="btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addFAQModal"><i class="bi bi-plus-lg"></i> Add FAQ</button></div>
</div>

<div class="row g-3">
    <div class="col-12">
        <div class="panel-card">
            <div class="panel-card-body">
                <div class="accordion" id="faqAccordion">
                    {% for faq in faqs %}
                    <div class="accordion-item border-0 mb-2">
                        <h2 class="accordion-header d-flex justify-content-between align-items-center">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#faq{{ faq.id }}" style="font-size:14px;font-weight:600;">
                                {{ faq.question }}
                            </button>
                            <div class="ms-3 d-flex pe-3">
                                <button class="btn btn-sm btn-light me-1" onclick="openEditModal('faq', '{{ faq.id }}')"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-danger" data-bs-toggle="modal" data-bs-target="#confirmActionModal" data-action="delete" data-url="/api/support/faqs/{{ faq.id }}/"><i class="bi bi-trash"></i></button>
                            </div>
                        </h2>
                        <div id="faq{{ faq.id }}" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                            <div class="accordion-body" style="font-size:13px;color:var(--text-secondary);">{{ faq.answer }}</div>
                        </div>
                    </div>
                    {% endfor %}
</div></div></div></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
